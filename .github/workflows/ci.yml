name: CI

on:
  push:
    branches:
      - develop
      - feature/develop/task2
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: test_db
      BASE_URL: http://localhost:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, curl
          ini-values: post_max_size=256M, upload_max_filesize=256M

      - name: Install Dependencies
        run: composer install

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..10}; do
            if mysqladmin ping -h "127.0.0.1" --silent; then
              echo "MySQL is up";
              exit 0;
            fi
            echo "Waiting for MySQL...";
            sleep 5;
          done
          exit 1

      - name: Set Environment Variable for Tests
        run: echo "BASE_URL=http://localhost:8000" >> $GITHUB_ENV

      - name: Start PHP Built-In Server
        run: |
          php -S localhost:8000 -t . > /dev/null 2>&1 &
          sleep 5

      - name: Run Unit Tests
        run: vendor/bin/phpunit --configuration phpunit.xml

      - name: Zip Site
        run: zip -r web2125Ki408Klymiuk09.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2125Ki408Klymiuk09
          path: web2125Ki408Klymiuk09.zip
